<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play · Memory Chambers</title>
<style>
  html,body{margin:0;height:100%;background:#0e1b1e;color:#e8e3d8;font-family:system-ui,sans-serif}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #unity-container{position:relative;width:100%;height:100%;max-width:calc(100vh*16/9);max-height:calc(100vw*9/16);margin:auto}
  #unity-canvas{width:100%;height:100%;background:#0e1b1e;display:block}
  #bar{position:absolute;left:10%;right:10%;bottom:12%;height:6px;background:#22383c;border-radius:3px;overflow:hidden}
  #fill{height:100%;width:0;background:#6cc4a4;transition:width .2s}
  #msg{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:14px;letter-spacing:.04em}
  .ctl{position:absolute;bottom:12px;z-index:2;padding:6px 12px;border:0;border-radius:6px;background:#ffffff22;color:#fff;cursor:pointer;font:13px system-ui,sans-serif;text-decoration:none}
  #fs{right:12px} #back{left:12px}
  body.embedded #back{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="msg">Loading Memory Chambers…</div>
    <div id="bar"><div id="fill"></div></div>
    <a id="back" class="ctl" href="../">← Portfolio</a>
    <button id="fs" class="ctl">Fullscreen</button>
  </div>
</div>
<script src="../Build/WebGL.loader.js"></script>
<script>
  if (window.self !== window.top) document.body.classList.add("embedded");
  const canvas = document.getElementById("unity-canvas");
  const config = {
    dataUrl: "../Build/WebGL.data.unityweb",
    frameworkUrl: "../Build/WebGL.framework.js.unityweb",
    codeUrl: "../Build/WebGL.wasm.unityweb",
    streamingAssetsUrl: "../StreamingAssets",
    companyName: "Spirit",
    productName: "Memory Chambers",
    productVersion: "1.0",
  };
  createUnityInstance(canvas, config, p => {
    document.getElementById("fill").style.width = (p * 100) + "%";
  }).then(inst => {
    document.getElementById("bar").style.display = "none";
    document.getElementById("msg").style.display = "none";
    document.getElementById("fs").onclick = () => inst.SetFullscreen(1);
    canvas.focus();
  }).catch(e => {
    document.getElementById("msg").textContent = "Failed to load: " + e;
  });
</script>
</body>
</html>
